name: Python tests

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]

jobs:
  research-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research_ready/requirements-research.txt
      - name: Install research dependencies
        run: python -m pip install -r research_ready/requirements-research.txt
      - name: Run research tests
        run: python -m pytest -q research_ready/tests

  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run security checks
        run: python security_tests.py
      - name: Run root tests
        run: python -m pytest -q tests
